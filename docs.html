<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.card {
    background: #1e293b;
    margin: 20px auto;
    padding: 20px;
    width: 300px;
    border-radius: 10px;
}

button {
    padding: 10px;
    border: none;
    border-radius: 5px;
    background: #38bdf8;
    cursor: pointer;
}
</style>

</head>
<body>

<h1>🤖 Dashboard Bota</h1>

<div class="card">
    <h2>Status</h2>
    <p id="status">Načítání...</p>
</div>

<div class="card">
    <h2>Uživatelé</h2>
    <p id="users">0</p>
</div>

<div class="card">
    <h2>Akce</h2>
    <button onclick="refresh()">🔄 Obnovit</button>
</div>

<br>
<a href="/">⬅️ Zpět</a>

<script>
function refresh() {
    document.getElementById("status").innerText = "🟢 Online";
    document.getElementById("users").innerText = Math.floor(Math.random() * 500);
}

// auto load
refresh();
</script>

</body>
</html>
